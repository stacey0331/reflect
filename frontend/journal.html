<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entry · reflect</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="entry" data-section="journal">
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <div class="content">
        <a class="back-link" href="index.html">Back to journal</a>

        <p class="empty error" id="entry-missing" hidden></p>

        <!-- Loaded by app.js from GET /api/journal/{id}; the id comes from ?id= in the URL -->
        <article id="entry" hidden>
          <header class="entry-header">
            <h1 id="entry-day"></h1>
            <span class="time-pill" id="entry-time"></span>
          </header>

          <div class="pixel-box entry-paper">
            <div class="entry-body" id="entry-body"></div>
            <textarea id="entry-editor" aria-label="Edit entry" hidden></textarea>

            <div class="composer-footer">
              <span class="status" id="entry-status" role="status" aria-live="polite"></span>

              <div class="entry-actions" id="view-actions">
                <!-- Edit -> switches to the editor; saving calls PUT /api/journal/{id} -->
                <button class="btn" id="edit-btn" type="button">Edit</button>
                <!-- Delete -> DELETE /api/journal/{id} -->
                <button class="btn btn-danger" id="delete-btn" type="button">Delete</button>
              </div>

              <div class="entry-actions" id="edit-actions" hidden>
                <button class="btn" id="cancel-btn" type="button">Cancel</button>
                <button class="btn btn-primary" id="save-changes-btn" type="button">
                  <span class="heart" aria-hidden="true"></span>Save changes
                </button>
              </div>
            </div>
          </div>
        </article>
      </div>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
